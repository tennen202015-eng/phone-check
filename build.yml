name: Build APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # يقبل أي ملف اسمه يبدأ بـ PhoneCheck وينتهي بـ .zip (لو الجوال غيّر الاسم)
      - name: Unpack source zip
        run: |
          Z=$(ls PhoneCheck*.zip 2>/dev/null | head -n 1)
          if [ -n "$Z" ]; then echo "Using $Z"; unzip -o "$Z" -d . ; fi
          ls -la

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      # أندرويد 16 (API 36)
      - name: Android SDK
        run: |
          export ANDROID_HOME="${ANDROID_HOME:-$HOME/android-sdk}"
          SDKM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKM" ]; then
            mkdir -p "$ANDROID_HOME/cmdline-tools"
            curl -sSL -o /tmp/cmd.zip https://dl.google.com/android/repository/commandlinetools-linux-13114758_latest.zip
            unzip -q /tmp/cmd.zip -d /tmp/cmd
            mv /tmp/cmd/cmdline-tools "$ANDROID_HOME/cmdline-tools/latest"
          fi
          yes | "$SDKM" --licenses > /dev/null || true
          "$SDKM" "platform-tools" "platforms;android-36" "build-tools;36.0.0"
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> "$GITHUB_ENV"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Build
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk PhoneCheck.apk

      - uses: actions/upload-artifact@v4
        with:
          name: PhoneCheck-apk
          path: PhoneCheck.apk

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: فاحص الجوال - نسخة ${{ github.run_number }}
          files: PhoneCheck.apk
