name: Build APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Unpack source zip (if uploaded as zip)
        run: |
          if [ -f PhoneCheck-src.zip ]; then unzip -o PhoneCheck-src.zip -d . ; fi
          ls -la

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk PhoneCheck.apk

      - uses: actions/upload-artifact@v4
        with:
          name: PhoneCheck-apk
          path: PhoneCheck.apk

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: فاحص الجوال - نسخة ${{ github.run_number }}
          files: PhoneCheck.apk
